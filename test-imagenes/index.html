<!DOCTYPE html>
<html lang="es">    
    <head>	    		   
        <title>Imágenes</title><meta charset="utf-8">
        <link rel="icon" href="favicon.ico">
        <style>
           img.grande { width: 500px; height: 500px; }
           img.media { width: 250px; height: 250px; }
           img.peque { width: 100px; height: 100px; }
        </style>
    </head>
    <body>
       <h1>Uso de CSS para especificar las dimensiones de una imagen</h1>
       <img src="imagenes/rosa_grande.png" alt="rosa" class="grande" />
       <img src="imagenes/rosa_media.png" alt="rosa" class="media" />
       <img src="imagenes/rosa_peque.png" alt="rosa" class="peque" />
    </body>
</html>
